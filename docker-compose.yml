services:
  janus:
    image: ${JANUS_IMAGE:-canyan/janus-gateway:latest}
    restart: unless-stopped
    command:
      - sh
      - -lc
      - |
        cp /config-template/*.jcfg /usr/local/etc/janus/
        sed -i "s/__LAN_HOST_IP__/${LAN_HOST_IP:-127.0.0.1}/g" /usr/local/etc/janus/janus.jcfg
        exec /usr/local/bin/janus
    volumes:
      - ./infra/janus:/config-template:ro
    ports:
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:7088:7088"
      - "127.0.0.1:8188:8188"
      - "127.0.0.1:7188:7188"
      - "127.0.0.1:6004:6004/udp"
      - "10000-10200:10000-10200/udp"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "1351:1351/udp"
    environment:
      SIGNALING_PORT: 4000
      CLIENT_ORIGIN: "*"
      JANUS_WS_URL: ws://janus:8188
      JANUS_STREAMING_ADMIN_KEY: streaming-admin-key
      JANUS_AUDIOBRIDGE_ADMIN_KEY: audiobridge-admin-key
      JANUS_STREAMING_BIND_HOST: janus
      JANUS_STREAMING_PUBLIC_HOST: ${LAN_HOST_IP:-127.0.0.1}
      JANUS_STREAMING_PORT_START: 5004
      JANUS_STREAMING_PORT_END: 5098
      JANUS_RTP_FORWARD_HOST: host.docker.internal
      JANUS_RTP_FORWARD_PORT: 7000
      WALKIE_RTP_PUBLIC_HOST: ${LAN_HOST_IP:-192.168.1.100}
      WALKIE_RTP_PORT_START: 1351
      WALKIE_RTP_PORT_END: 1351
      WALKIE_RTP_INPUT_CODEC: pcma
      WALKIE_RTP_INPUT_PAYLOAD_TYPE: 8
      WALKIE_RTP_AUTO_RADIO_ENABLED: ${WALKIE_RTP_AUTO_RADIO_ENABLED:-true}
      WALKIE_RTP_AUTO_RADIO_ID: ${WALKIE_RTP_AUTO_RADIO_ID:-radio-main}
      WALKIE_RTP_AUTO_RADIO_DISPLAY_NAME: ${WALKIE_RTP_AUTO_RADIO_DISPLAY_NAME:-Radio Gateway}
      WALKIE_RTP_AUTO_RADIO_REARM_SEC: ${WALKIE_RTP_AUTO_RADIO_REARM_SEC:-3}
      WALKIE_RTP_BROWSER_MIRROR_ENABLED: ${WALKIE_RTP_BROWSER_MIRROR_ENABLED:-true}
      WALKIE_RTP_BROWSER_MIRROR_HOST: ${WALKIE_RTP_BROWSER_MIRROR_HOST:-192.168.1.152}
      WALKIE_RTP_BROWSER_MIRROR_PORT: ${WALKIE_RTP_BROWSER_MIRROR_PORT:-1350}
      WALKIE_RTP_BROWSER_MIRROR_CODEC: ${WALKIE_RTP_BROWSER_MIRROR_CODEC:-pcma}
      WALKIE_RTP_BROWSER_MIRROR_PAYLOAD_TYPE: ${WALKIE_RTP_BROWSER_MIRROR_PAYLOAD_TYPE:-8}
      FFMPEG_PATH: ffmpeg

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "4173:4173"
